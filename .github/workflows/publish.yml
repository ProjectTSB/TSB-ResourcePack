name: publish

on:
  workflow_run:
    workflows: [Generate effect icon.json]
    types: [completed]
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish or remove if it no longer exists
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dev-resourcepacks
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/github-script@v8
        with:
          script: |
            const { publish } = require('./.github/scripts/publish.cjs');
            await publish({ github, context, core });
